<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Distributed Compute Engines</title>
  <desc id="d">Benchmarking Ray, Dask, Spark and AWS EMR on a cluster of connected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0F1E3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#94A3B8" fill-opacity="0.12"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Network edges -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="1000" y1="160" x2="850" y2="90"/>
    <line x1="1000" y1="160" x2="880" y2="235"/>
    <line x1="1000" y1="160" x2="1010" y2="50"/>
    <line x1="1000" y1="160" x2="1030" y2="275"/>
    <line x1="1000" y1="160" x2="1160" y2="95"/>
    <line x1="1000" y1="160" x2="1170" y2="230"/>
    <line x1="1000" y1="160" x2="780" y2="165"/>
    <line x1="1000" y1="160" x2="1235" y2="160"/>
  </g>
  <g stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1" fill="none">
    <line x1="850" y1="90" x2="1010" y2="50"/>
    <line x1="1010" y1="50" x2="1160" y2="95"/>
    <line x1="1160" y1="95" x2="1235" y2="160"/>
    <line x1="1235" y1="160" x2="1170" y2="230"/>
    <line x1="1170" y1="230" x2="1030" y2="275"/>
    <line x1="1030" y1="275" x2="880" y2="235"/>
    <line x1="880" y1="235" x2="780" y2="165"/>
    <line x1="780" y1="165" x2="850" y2="90"/>
  </g>

  <!-- Head node -->
  <circle cx="1000" cy="160" r="34" fill="#2DD4BF" fill-opacity="0.35" filter="url(#soft)"/>
  <circle cx="1000" cy="160" r="22" fill="#0A1020" stroke="#2DD4BF" stroke-width="3"/>
  <circle cx="1000" cy="160" r="8" fill="#2DD4BF"/>

  <!-- Worker nodes: Ray (cyan), Dask (amber), Spark (orange), EMR (violet) -->
  <g stroke-width="2.5" fill="#0A1020">
    <circle cx="850" cy="90" r="12" stroke="#22D3EE"/>
    <circle cx="880" cy="235" r="12" stroke="#FBBF24"/>
    <circle cx="1010" cy="50" r="12" stroke="#FB923C"/>
    <circle cx="1030" cy="275" r="12" stroke="#A78BFA"/>
    <circle cx="1160" cy="95" r="12" stroke="#22D3EE"/>
    <circle cx="1170" cy="230" r="12" stroke="#FBBF24"/>
    <circle cx="780" cy="165" r="9" stroke="#FB923C"/>
    <circle cx="1235" cy="160" r="9" stroke="#A78BFA"/>
  </g>
  <g>
    <circle cx="850" cy="90" r="4" fill="#22D3EE"/>
    <circle cx="880" cy="235" r="4" fill="#FBBF24"/>
    <circle cx="1010" cy="50" r="4" fill="#FB923C"/>
    <circle cx="1030" cy="275" r="4" fill="#A78BFA"/>
    <circle cx="1160" cy="95" r="4" fill="#22D3EE"/>
    <circle cx="1170" cy="230" r="4" fill="#FBBF24"/>
    <circle cx="780" cy="165" r="3" fill="#FB923C"/>
    <circle cx="1235" cy="160" r="3" fill="#A78BFA"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="86" font-size="13" font-weight="600" letter-spacing="3" fill="#2DD4BF">BIG DATA ARCHITECTURES  ·  COMILLAS ICAI</text>
    <text x="64" y="148" font-size="50" font-weight="700" fill="#F8FAFC">Distributed</text>
    <text x="64" y="204" font-size="50" font-weight="700" fill="#F8FAFC">Compute Engines</text>
    <text x="64" y="244" font-size="18" fill="#94A3B8">Benchmarking Ray, Dask, Spark and AWS EMR</text>

    <!-- Legend -->
    <g font-size="13" fill="#CBD5E1">
      <circle cx="68" cy="278" r="5" fill="#22D3EE"/><text x="80" y="283">Ray</text>
      <circle cx="132" cy="278" r="5" fill="#FBBF24"/><text x="144" y="283">Dask</text>
      <circle cx="204" cy="278" r="5" fill="#FB923C"/><text x="216" y="283">Spark</text>
      <circle cx="286" cy="278" r="5" fill="#A78BFA"/><text x="298" y="283">AWS EMR</text>
    </g>
  </g>
</svg>
