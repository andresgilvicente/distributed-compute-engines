services:

  ray-head:

    image: ${RAY_IMAGE}

    container_name: ray-head

    ports:

      - "${REDISPORT}:${REDISPORT}"           # Redis port

      - "${DASHBOARDPORT}:${DASHBOARDPORT}"   # Ray dashboard port

      - "${HEADNODEPORT}:${HEADNODEPORT}"     # Ray client port (head node)

    env_file:

      - .env

    command: >

      bash -c "ray start --head --num-cpus=0 --port=${REDISPORT} --dashboard-port=${DASHBOARDPORT} --dashboard-host=0.0.0.0 --redis-password=${REDISPASSWORD} --block"

      # --num-cpus=0 so the head node does not schedule tasks

    shm_size: 2g

    cpuset: "1"                              # Pin the head node to CPU 1 (coordination only)

    networks:

      - ray_net
 
  ray-worker-1:

    image: ${RAY_IMAGE}

    container_name: ray-worker-1

    env_file:

      - .env

    command: >

      bash -c "ray start --address=ray-head:${REDISPORT} --redis-password=${REDISPASSWORD} --num-cpus=1 --block"

    shm_size: 2g

    cpuset: "0"                             # Pin worker 1 to CPU 0 (computation)

    networks:

      - ray_net
 
  ray-worker-2:

    image: ${RAY_IMAGE}

    container_name: ray-worker-2

    env_file:

      - .env

    command: >

      bash -c "ray start --address=ray-head:${REDISPORT} --redis-password=${REDISPASSWORD} --num-cpus=1 --block"

    shm_size: 2g

    cpuset: "1"

    networks:

      - ray_net
 
  ray-worker-3:

    image: ${RAY_IMAGE}

    container_name: ray-worker-3

    env_file:

      - .env

    command: >

      bash -c "ray start --address=ray-head:${REDISPORT} --redis-password=${REDISPASSWORD} --num-cpus=1 --block"

    shm_size: 2g

    cpuset: "0"

    networks:

      - ray_net
 
networks:

  ray_net:

    driver: bridge

    